<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Career Claw{% endblock %}</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #FFFFFF;
      --dark: #1A1A1A;
      --yellow: #F5C542;
      --yellow-light: #FAE07A;
      --card: #F8F8F8;
      --dark-bg: #1C1C24;
      --muted: #6B6355;
      --border: 2.5px solid #1A1A1A;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Space Grotesk', sans-serif;
      background: var(--bg);
      color: var(--dark);
      overflow-x: hidden;
    }
    /* Paper texture overlay */
    body::after {
      content: '';
      position: fixed; inset: 0;
      background-image: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/></filter><rect width='200' height='200' filter='url(%23n)' opacity='0.08'/></svg>");
      pointer-events: none;
      z-index: 9999;
    }
    /* NAV */
    nav {
      background: var(--bg);
      border-bottom: var(--border);
      padding: 0 2.5rem;
      position: sticky; top: 0; z-index: 100;
    }
    .nav-inner {
      max-width: 1200px; margin: 0 auto;
      display: flex; align-items: center; justify-content: space-between;
      height: 66px;
    }
    .nav-logo {
      display: flex; align-items: center; gap: 10px;
      font-family: 'Space Mono', monospace;
      font-weight: 700; font-size: 1.15rem;
      color: var(--dark); text-decoration: none;
    }
    .nav-logo svg { flex-shrink: 0; }
    .nav-links { display: flex; gap: 0.25rem; }
    .nav-links a {
      color: var(--dark); text-decoration: none;
      font-weight: 600; font-size: 0.95rem;
      padding: 8px 18px;
      border: 2.5px solid transparent;
      transition: all 0.15s;
    }
    .nav-links a:hover { background: var(--yellow); border-color: var(--dark); }
    .nav-links a.active {
      background: var(--yellow);
      border: 2.5px solid var(--dark);
      box-shadow: 3px 3px 0 var(--dark);
    }
    main { min-height: calc(100vh - 66px); }
    /* FOOTER */
    footer {
      background: var(--dark);
      color: var(--bg);
      border-top: var(--border);
      padding: 2rem 2.5rem;
    }
    .footer-inner {
      max-width: 1200px; margin: 0 auto;
      display: flex; align-items: center; justify-content: space-between;
    }
    .footer-logo {
      font-family: 'Space Mono', monospace;
      font-weight: 700; font-size: 1rem;
      color: var(--yellow);
    }
    .footer-note {
      font-size: 0.8rem;
      color: #888;
      font-family: 'Space Mono', monospace;
    }
    /* BUTTONS */
    .btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 12px 28px; font-size: 1rem; font-weight: 700;
      font-family: 'Space Grotesk', sans-serif;
      border: var(--border); cursor: pointer;
      text-decoration: none; transition: transform 0.1s, box-shadow 0.1s;
    }
    .btn-dark {
      background: var(--dark); color: var(--bg);
      box-shadow: 5px 5px 0 var(--yellow);
    }
    .btn-dark:hover { transform: translate(-2px, -2px); box-shadow: 7px 7px 0 var(--yellow); }
    .btn-outline {
      background: transparent; color: var(--dark);
      box-shadow: 5px 5px 0 var(--dark);
    }
    .btn-outline:hover { transform: translate(-2px, -2px); box-shadow: 7px 7px 0 var(--dark); }
    .btn-yellow {
      background: var(--yellow); color: var(--dark);
      box-shadow: 5px 5px 0 var(--dark);
    }
    .btn-yellow:hover { transform: translate(-2px, -2px); box-shadow: 7px 7px 0 var(--dark); }
    /* TAGS */
    .tag {
      display: inline-flex; align-items: center; gap: 6px;
      font-family: 'Space Mono', monospace;
      font-size: 0.7rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.1em;
      padding: 4px 12px;
      border: 2px solid var(--dark);
      background: var(--yellow);
      box-shadow: 2px 2px 0 var(--dark);
    }
    /* CARDS */
    .card {
      background: var(--card);
      border: 2.5px solid var(--dark);
      padding: 2rem;
      box-shadow: 5px 5px 0 var(--dark);
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .card:hover {
      transform: translate(-3px, -3px);
      box-shadow: 8px 8px 0 var(--dark);
    }
  </style>
  {% block extra_head %}{% endblock %}
</head>
<body>
  <nav>
    <div class="nav-inner">
      <a href="/" class="nav-logo">
        <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
          <rect x="4" y="2" width="20" height="12" rx="2" fill="#F5C542" stroke="#1A1A1A" stroke-width="2"/>
          <rect x="8" y="5" width="8" height="6" rx="1" fill="#1A1A1A"/>
          <circle cx="20" cy="8" r="3" fill="#FAF6EE" stroke="#1A1A1A" stroke-width="1.5"/>
          <rect x="12" y="14" width="4" height="5" fill="#D4B832" stroke="#1A1A1A" stroke-width="1.5"/>
          <path d="M14 19 Q10 22 10 25 Q10 27 14 27 Q18 27 18 25" stroke="#1A1A1A" stroke-width="2" fill="none" stroke-linecap="round"/>
        </svg>
        Career Claw
      </a>
      <div class="nav-links">
        <a href="/home" class="{{ 'active' if active == 'home' else '' }}">Home</a>
        <a href="/components" class="{{ 'active' if active == 'components' else '' }}">Components</a>
        <a href="/workflows" class="{{ 'active' if active == 'workflows' else '' }}">Workflows</a>
      </div>
    </div>
  </nav>
  <main>{% block content %}{% endblock %}</main>
  <footer>
    <div class="footer-inner">
      <span class="footer-logo">Career Claw</span>
    </div>
  </footer>
</body>
</html>
